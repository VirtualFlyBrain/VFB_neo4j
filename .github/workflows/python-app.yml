# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: '**'
    tags: '**'
  pull_request:
    branches: '**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"   # as the pipeline (python:3.11-slim); GitHub no longer provides 3.7
    - name: Start databases
      run: |
        # KB: an empty Neo4j 4.4; the tests create what they need. (vfb-prod:kb-v4-2 ships a ~1.8M-node KB snapshot,
        # and the tests' full-graph scans and DETACH DELETE teardown ran out of heap and took 20+ min on it.)
        docker run -d --name db -p 7474:7474 -p 7687:7687 --env=NEO4J_AUTH=neo4j/test --env=NEO4J_dbms_memory_heap_max__size=1G --volume=$(pwd)/src/:/import/ neo4j:4.4
        # PDB: an empty Neo4j 4.4 (the production PDB's version) seeded from .github/ci/pdb_seed.cypher in "PDB checks".
        # The productiondb image downloads and unpacks the 13 GB live PDB, which never finished on a runner.
        docker run -d --name pdb -p 7475:7474 -p 7688:7687 --env=NEO4J_AUTH=neo4j/test --env=NEO4J_dbms_memory_heap_max__size=1G --volume=$(pwd)/src/:/import/ --volume=$(pwd)/.github/ci/:/seed/ neo4j:4.4
        sleep 60s
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      continue-on-error: true
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Install VFBconnect
      run: |
        git clone https://github.com/VirtualFlyBrain/VFB_connect.git
        pip install -r VFB_connect/requirements.txt
    - name: Run offline tests   # no database needed: run before the DB start-up checks
      run: |
        cd src
        python -m unittest uk.ac.ebi.vfb.neo4j.test.unwind_batching_tests uk.ac.ebi.vfb.neo4j.flybase2neo.test.commit_via_csv_tests
    - name: KB checks
      timeout-minutes: 960
      run: |
        echo -e "KB check:"
        sleep 190
        export LANDING_PAGE="http://localhost:7474/browser/"  
        Test () { export http_status=$(curl -s -i -u neo4j:test $LANDING_PAGE | grep HTTP/1.1 | awk {'print $2'}); echo "Returned status \"$http_status\""; if [ "$http_status" != "200" ]; then echo "Waiting for docker to finish building..."; iterations=$((iterations+1)); if [ "$iterations" != "200" ]; then sleep 1; Test; fi; else echo "$(date) - connected successfully"; fi; }
        Test || :
        sleep 30
        curl -sSf -u neo4j:test "$LANDING_PAGE"
    - name: PDB checks
      timeout-minutes: 960
      run: |
        echo -e "PDB check:"
        export LANDING_PAGE="http://localhost:7475/browser/"  
        Test () { export http_status=$(curl -s -i -u neo4j:test $LANDING_PAGE | grep HTTP/1.1 | awk {'print $2'}); echo "Returned status \"$http_status\""; if [ "$http_status" != "200" ]; then echo "Waiting for docker to finish building..."; iterations=$((iterations+1)); if [ "$iterations" != "200" ]; then sleep 1; Test; fi; else echo "$(date) - connected successfully"; fi; }
        Test || :
        sleep 30
        curl -sSf -u neo4j:test "$LANDING_PAGE"
        docker exec pdb cypher-shell -u neo4j -p test -f /seed/pdb_seed.cypher
        docker exec pdb cypher-shell -u neo4j -p test --format plain "MATCH (n) RETURN labels(n)[0] AS label, count(*) AS n ORDER BY label"
    - name: KB startup log
      if: always()
      run: |
        echo -e "KB log"
        docker logs db
    - name: PDB startup log
      if: always()
      run: |
        echo -e "PDB log"
        docker logs pdb 
    - name: Run KB_tools_test
      run: |
        export PYTHONPATH=$PYTHONPATH":/"$(pwd)/VFB_connect/src
        cd src
        python -m uk.ac.ebi.vfb.neo4j.test.KB_tools_test 
    - name: Run neo_tools_tests
      run: |
        export PYTHONPATH=$PYTHONPATH":/"$(pwd)/VFB_connect/src
        cd src
        python -m uk.ac.ebi.vfb.neo4j.test.neo_tools_tests
    - name: Run feature_tools_tests
      run: |
        export PYTHONPATH=$PYTHONPATH":/"$(pwd)/VFB_connect/src
        cd src
        python -m uk.ac.ebi.vfb.neo4j.flybase2neo.test.feature_tools_tests
    - name: Run pub_tools_tests
      run: |
        export PYTHONPATH=$PYTHONPATH":/"$(pwd)/VFB_connect/src
        cd src
        python -m uk.ac.ebi.vfb.neo4j.flybase2neo.test.pub_tools_tests
    - name: Run flybase2neo expression_runner test
      run: |
        export PYTHONPATH=$PYTHONPATH":/"$(pwd)/VFB_connect/src
        export IMPORT=$(pwd)/src/
        cd src
        python -m uk.ac.ebi.vfb.neo4j.flybase2neo.expression_runner --test http://localhost:7475 neo4j test $IMPORT 
    - name: Run flybase2neo add_refs_for_anat 
      run: |
        export PYTHONPATH=$PYTHONPATH":/"$(pwd)/VFB_connect/src
        cd src
        python -m uk.ac.ebi.vfb.neo4j.flybase2neo.add_refs_for_anat http://localhost:7475 neo4j test
    
    
